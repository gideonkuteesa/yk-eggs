<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f4b400">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="styles.css">
  <title>YK Eggs • Egg Calculator</title>
</head>
<body>
  <header class="topbar">
    <div>
      <div class="brand">YK <span>EGGS</span></div>
      <div class="tagline">Egg Distribution Management</div>
    </div>
    <button id="installBtn" class="icon-btn hidden" aria-label="Install app">＋</button>
  </header>

  <nav class="tabs">
    <button class="tab active" data-page="calculator">Calculator</button>
    <button class="tab" data-page="history">History</button>
    <button class="tab" data-page="dashboard">Dashboard</button>
  </nav>

  <main>
    <section id="calculator" class="page active">
      <div class="hero-card">
        <div class="eyebrow">YK EGGS</div>
        <h1>Egg Price Calculator</h1>
        <p>Calculate your selling price, profit and margin in seconds.</p>
      </div>

      <form id="calcForm" class="card">
        <label>Customer / Trader
          <input id="customer" type="text" placeholder="e.g. Sarah Shop">
        </label>
        <label>Region
          <select id="region">
            <option>Kampala</option><option>Entebbe</option><option>Wakiso</option>
            <option>Jinja</option><option>Mukono</option><option>Other</option>
          </select>
        </label>
        <div class="grid2">
          <label>Trays
            <input id="trays" type="number" min="1" step="1" value="10" required>
          </label>
          <label>Eggs / Tray
            <input id="eggsPerTray" type="number" min="1" value="30" required>
          </label>
        </div>
        <div class="grid2">
          <label>Cost / Tray (UGX)
            <input id="costPerTray" type="number" min="0" step="100" placeholder="12000" required>
          </label>
          <label>Selling / Tray (UGX)
            <input id="sellPerTray" type="number" min="0" step="100" placeholder="14000" required>
          </label>
        </div>
        <div class="grid2">
          <label>Transport (UGX)
            <input id="transport" type="number" min="0" step="100" value="0">
          </label>
          <label>Other Costs (UGX)
            <input id="otherCosts" type="number" min="0" step="100" value="0">
          </label>
        </div>
        <button class="primary" type="submit">Calculate</button>
        <button class="secondary" type="button" id="resetBtn">Reset</button>
      </form>

      <div id="results" class="results hidden"></div>
    </section>

    <section id="history" class="page">
      <div class="section-head"><h2>Calculation History</h2><button id="clearHistory" class="danger small">Clear</button></div>
      <div id="historyList"></div>
    </section>

    <section id="dashboard" class="page">
      <h2>Dashboard</h2>
      <div id="dashboardStats" class="stats-grid"></div>
      <div class="card">
        <h3>Recent Calculations</h3>
        <div id="recentList"></div>
      </div>
    </section>
  </main>

  <div id="toast" class="toast"></div>
  <script src="app.js"></script>
</body>
</html>
